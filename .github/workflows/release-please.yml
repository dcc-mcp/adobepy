name: Release Please

on:
  push:
    branches:
      - main
  # Backstop only. A release is tagged once its release PR is merged, and
  # GitHub throttles this far below the declared cadence (six runs landed
  # across 2026-09-27 instead of 48), so the merge step below re-dispatches
  # this workflow instead of waiting on the cron.
  schedule:
    - cron: "*/30 * * * *"
  # Manual escape hatch. Normal releases never need it.
  workflow_dispatch:

# Least privilege: only the release-please job writes. Every other job inherits
# read-only and declares what it needs on the job itself.
#
# Review ACKs on this repository are bound to a diff fingerprint, not to a head
# SHA; the recipe that makes one reproducible is fixed in
# docs/review-fingerprint.md. Record it alongside the ACK so a rebase does not
# invalidate a review.
permissions:
  contents: read

# Serialize runs so a scheduled run and a push run never race to tag the same
# release.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Needed to read the release PR's check runs before merging it. GitHub
      # scopes the installation token to exactly the permissions listed here
      # and zeroes everything else, so the gate declares the scope it uses
      # rather than relying on a default.
      #
      # It is not currently load-bearing on this repository: it is public, so
      # the check-runs call also succeeds on a token without this scope
      # (measured in probe A of run 36394388128,
      # https://github.com/dcc-mcp/adobepy/actions/runs/36394388128). It is
      # kept for least privilege; the failure mode it prevents is unmeasured
      # on this public repository. What is measured is how this step reacts
      # when the call is refused at all: `::error title=Check query failed`
      # plus `fail=1` and `continue`, so the PR is never merged on that pass.
      checks: read
      # Needed to start the CI workflow on the release PR branch.
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The gate below is a script in the repository, so this job needs the
      # checkout it previously did not have.
      - uses: actions/checkout@v4
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # Merging the release PR only advances the manifest. The tag, the GitHub
      # Release and the PyPI upload are cut by a *later* run of this job. The
      # merge is performed with GITHUB_TOKEN, and a push made with GITHUB_TOKEN
      # does not raise a `push` event, so the merge commit never starts this
      # workflow on its own. This step re-dispatches it once the merge lands,
      # which is what actually finishes the release.
      #
      # The merge is also gated on green checks. `main` declares no required
      # status checks, so arming auto-merge the moment the release PR is opened
      # let PR #87 merge seven seconds after it was created and killed both CI
      # runs that had just started for it. This step supplies the gate that
      # branch protection does not provide here.
      #
      # Every step below is idempotent. CI is only requested when the head of
      # the release PR carries no verdict — no workflow run, no check runs, or
      # only cancelled ones — so a release PR whose CI is merely in flight does
      # not re-run the full matrix on every pass.
      #
      # The re-dispatch is loop-free: it only fires in the run that performed
      # the merge, and the follow-up run finds no open release PR and exits.
      #
      # Failures must fail the run. Silently downgrading them to a log line
      # would turn "someone clicks merge" into "someone watches for a stall",
      # which is the manual step this workflow exists to remove.
      - name: Gate and merge the release PR, then finish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # A release PR that is still open after this many hours is stuck:
          # its checks never went green or auto-merge never landed it.
          STALL_HOURS: "6"
          # Auto-merge armed here has no required checks to wait for, so it
          # lands in seconds. Bound the wait anyway, so a slow merge cannot
          # hold this job past the next scheduled pass.
          MERGE_TIMEOUT_SECONDS: "300"
          MERGE_POLL_SECONDS: "15"
        run: |
          bash "$GITHUB_WORKSPACE/scripts/gate-release-pr.sh"

  python-package:
    name: Build Python package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_native_abi3_config.py
      - run: python scripts/check_wheel_compat.py dist
      - run: python scripts/smoke_wheel_install.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-python-dist
          path: dist/*

  pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - python-package
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Publishing stays fully automated only while this environment has no
    # required reviewers and no wait timer. Adding either one re-introduces a
    # manual approval step before every PyPI upload.
    environment:
      name: pypi
      url: https://pypi.org/project/adobepy/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adobepy-python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  windows-package:
    name: Build Windows package and upload to release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install --upgrade "coverage[toml]" setuptools wheel
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Upload to GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem "dist/*" -Include "*.zip","*.zip.sha256" | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No release assets found in dist/" }
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          gh release upload $tag $assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  standalone-package:
    name: Build standalone interpreter (${{ matrix.runtime-id }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            runtime-id: macos-arm64
            artifact: adobepy-standalone-macos-arm64
          - os: ubuntu-latest
            runtime-id: linux-x64
            artifact: adobepy-standalone-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build adobepy wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade build wheel
          python3 -m build --wheel --outdir dist
      - name: Build standalone interpreter with PyOxidizer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install pyoxidizer
          wheel=$(ls dist/adobepy-*.whl 2>/dev/null | head -1)
          if [ -z "$wheel" ]; then echo "adobepy wheel was not built"; exit 1; fi
          wheel_abs="$(cd "$(dirname "$wheel")" && pwd)/$(basename "$wheel")"
          pyoxidizer build --release --path pyadobe --var ADOBEPY_WHEEL "$wheel_abs"
      # `macos-latest` is arm64, but the runner image can still report x86_64
      # under Rosetta. Assert the resolved runtime id rather than deriving the
      # asset name from `uname -m`, so a silent x86_64 fallback is never
      # published as a macos-arm64 asset.
      - name: Resolve runtime id
        shell: bash
        env:
          EXPECTED_RUNTIME_ID: ${{ matrix.runtime-id }}
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$EXPECTED_RUNTIME_ID" in
            macos-arm64)
              [ "$arch" = "arm64" ] || {
                echo "::error title=Unexpected macOS architecture::'$EXPECTED_RUNTIME_ID' requires an arm64 runner, got '$arch'"; exit 1; }
              resolved="macos-arm64" ;;
            linux-x64)
              [ "$arch" = "x86_64" ] || {
                echo "::error title=Unexpected Linux architecture::'$EXPECTED_RUNTIME_ID' requires an x86_64 runner, got '$arch'"; exit 1; }
              resolved="linux-x64" ;;
            *)
              echo "::error::unsupported runtime id '$EXPECTED_RUNTIME_ID'"; exit 1 ;;
          esac
          echo "RESOLVED_RUNTIME_ID=$resolved" >> "$GITHUB_ENV"
      - name: Locate build output and package
        shell: bash
        run: |
          set -euo pipefail
          adobepy_sha256() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          build_dir=$(ls -d build/*/release/install 2>/dev/null | head -1)
          if [ -z "$build_dir" ]; then echo "PyOxidizer build output not found"; exit 1; fi
          echo "STANDALONE_BUILD_DIR=$build_dir" >> "$GITHUB_ENV"
          version=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          package_name="adobepy-standalone-$version-$RESOLVED_RUNTIME_ID"
          dist_dir="${{ github.workspace }}/dist"
          mkdir -p "$dist_dir"
          (cd "$build_dir" && zip -r "$dist_dir/$package_name.zip" .)
          hash=$(adobepy_sha256 "$dist_dir/$package_name.zip")
          echo "$hash  $package_name.zip" > "$dist_dir/$package_name.zip.sha256"
      # The zip is built from a directory tree, so the smoke test runs the
      # unpacked interpreter. It is the same bytes that get zipped, and it keeps
      # the macOS smoke from depending on `unzip` behaviour across runner images.
      #
      # `from adobe.photoshop import Photoshop` only imports the SDK; it opens no
      # connection, so it passes with no Adobe host present. That is what makes
      # the Linux leg meaningful at all — it proves the interpreter boots and the
      # SDK is importable, not that a live host is reachable.
      - name: Smoke test standalone interpreter
        shell: bash
        run: |
          set -euo pipefail
          "$STANDALONE_BUILD_DIR/adobepy-python" -c "import sys; from adobe.photoshop import Photoshop; assert sys.version_info >= (3, 8); print('standalone smoke OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/adobepy-standalone-*.zip
            dist/adobepy-standalone-*.zip.sha256
      - name: Upload to GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          assets=$(ls dist/adobepy-standalone-*.zip dist/adobepy-standalone-*.zip.sha256 2>/dev/null | tr '\n' ' ')
          if [ -z "$assets" ]; then echo "No standalone release assets found in dist/"; exit 1; fi
          gh release upload "${{ needs.release-please.outputs.tag_name }}" $assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
