name: Release Please

on:
  push:
    branches:
      - main
  # Safety net. A release is tagged once its release PR is merged; if that
  # merge ever fails to start this workflow, the scheduled run finishes the
  # release instead of leaving it half-published.
  schedule:
    - cron: "*/30 * * * *"
  # Manual escape hatch. Normal releases never need it.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Needed to start the CI workflow on the release PR branch.
  actions: write

# Serialize runs so a scheduled run and a push run never race to tag the same
# release.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # Release PRs are pushed with GITHUB_TOKEN, and GitHub does not fire
      # `pull_request` workflows for those pushes, so the PR never reports the
      # status checks that `main` requires. Start CI on the release branch
      # explicitly, then let GitHub merge the PR the moment those required
      # checks are green.
      #
      # This removes the human merge click without removing the quality gate:
      # branch protection still decides whether the release PR may land.
      - name: Verify and auto-merge the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--main"))')
          if [ -z "$prs" ]; then
            echo "No open release PR; nothing to fast-forward."
            exit 0
          fi
          echo "$prs" | jq -r '"\(.number) \(.headRefName)"' | while read -r number branch; do
            echo "Requesting CI for release PR #$number on $branch"
            gh workflow run ci.yml --ref "$branch" \
              || echo "CI dispatch failed for $branch; the scheduled run will retry."
            echo "Enabling auto-merge for release PR #$number"
            gh pr merge --auto --squash "$number" \
              || echo "Auto-merge request failed for #$number; the scheduled run will retry."
          done

  python-package:
    name: Build Python package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_native_abi3_config.py
      - run: python scripts/check_wheel_compat.py dist
      - run: python scripts/smoke_wheel_install.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-python-dist
          path: dist/*

  pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - python-package
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Publishing stays fully automated only while this environment has no
    # required reviewers and no wait timer. Adding either one re-introduces a
    # manual approval step before every PyPI upload.
    environment:
      name: pypi
      url: https://pypi.org/project/adobepy/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adobepy-python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  windows-package:
    name: Build Windows package and upload to release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install --upgrade "coverage[toml]" setuptools wheel
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Upload to GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem "dist/*" -Include "*.zip","*.zip.sha256" | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No release assets found in dist/" }
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          gh release upload $tag $assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
