name: Release Please

on:
  push:
    branches:
      - main
  # Backstop only. A release is tagged once its release PR is merged, and
  # GitHub throttles this far below the declared cadence (six runs landed
  # across 2026-09-27 instead of 48), so the merge step below re-dispatches
  # this workflow instead of waiting on the cron.
  schedule:
    - cron: "*/30 * * * *"
  # Manual escape hatch. Normal releases never need it.
  workflow_dispatch:

# Least privilege: only the release-please job writes. Every other job inherits
# read-only and declares what it needs on the job itself.
permissions:
  contents: read

# Serialize runs so a scheduled run and a push run never race to tag the same
# release.
concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Needed to start the CI workflow on the release PR branch.
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # Merging the release PR only advances the manifest. The tag, the GitHub
      # Release and the PyPI upload are cut by a *later* run of this job. The
      # merge is performed with GITHUB_TOKEN, and a push made with GITHUB_TOKEN
      # does not raise a `push` event, so the merge commit never starts this
      # workflow on its own. This step re-dispatches it once the merge lands,
      # which is what actually finishes the release.
      #
      # The merge is also gated on green checks. `main` declares no required
      # status checks, so arming auto-merge the moment the release PR is opened
      # let PR #87 merge seven seconds after it was created and killed both CI
      # runs that had just started for it. This step supplies the gate that
      # branch protection does not provide here.
      #
      # Every step below is idempotent. CI is only requested when the release
      # branch reports no check runs at all, so a release PR that is waiting
      # does not re-run the full CI matrix on every pass.
      #
      # The re-dispatch is loop-free: it only fires in the run that performed
      # the merge, and the follow-up run finds no open release PR and exits.
      #
      # Failures must fail the run. Silently downgrading them to a log line
      # would turn "someone clicks merge" into "someone watches for a stall",
      # which is the manual step this workflow exists to remove.
      - name: Gate and merge the release PR, then finish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # A release PR that is still open after this many hours is stuck:
          # its checks never went green or auto-merge never landed it.
          STALL_HOURS: "6"
          # Auto-merge armed here has no required checks to wait for, so it
          # lands in seconds. Bound the wait anyway, so a slow merge cannot
          # hold this job past the next scheduled pass.
          MERGE_TIMEOUT_SECONDS: "300"
          MERGE_POLL_SECONDS: "15"
        run: |
          set -euo pipefail
          prs=$(gh pr list --base main --limit 100 --state open --json number,headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("release-please--branches--main")) | "\(.number) \(.headRefName) \(.headRefOid)"')
          if [ -z "$prs" ]; then
            echo "No open release PR; nothing to fast-forward."
            exit 0
          fi

          mapfile -t entries <<< "$prs"
          if [ "${#entries[@]}" -ne 1 ]; then
            echo "::warning title=Unexpected release PR count::Found ${#entries[@]} open release PRs; merging more than one would collide on PyPI."
          fi

          fail=0
          merged=0
          for entry in "${entries[@]}"; do
            read -r number branch head_sha <<< "$entry"
            echo "Release PR #$number on $branch at $head_sha"
            landed=0

            check_url="repos/$GH_REPO/commits/$head_sha/check-runs?per_page=100&filter=latest"
            if ! raw=$(gh api --paginate "$check_url" --jq '.check_runs[] | "\(.status)|\(.conclusion)"'); then
              echo "::error title=Check query failed::Could not read check runs for $head_sha"
              fail=1
              continue
            fi
            if [ -z "$raw" ]; then
              total=0; pending=0; broken=0; passed=0
            else
              mapfile -t runs <<< "$raw"
              total=${#runs[@]}; pending=0; broken=0; passed=0
              for run in "${runs[@]}"; do
                status="${run%%|*}"
                conclusion="${run##*|}"
                if [ "$status" != "completed" ]; then
                  pending=$((pending + 1))
                elif [ "$conclusion" = "success" ]; then
                  passed=$((passed + 1))
                elif [ "$conclusion" = "skipped" ] || [ "$conclusion" = "neutral" ]; then
                  :
                else
                  broken=$((broken + 1))
                fi
              done
            fi
            echo "  checks: $passed passed, $pending pending, $broken failed, $total total"

            if [ "$total" -eq 0 ]; then
              echo "  no checks reported yet; requesting CI on $branch"
              if ! gh workflow run ci.yml --ref "$branch"; then
                echo "::error title=CI dispatch failed::Could not start ci.yml on $branch"
                fail=1
              fi
            elif [ "$pending" -gt 0 ]; then
              echo "  CI still running on $head_sha; waiting for the next pass."
            elif [ "$broken" -gt 0 ] || [ "$passed" -eq 0 ]; then
              echo "::error title=Release PR checks are not green::PR #$number at $head_sha reports $broken failing and $passed successful check(s); refusing to merge it."
              fail=1
            else
              if [ "$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest == null')" = "true" ]; then
                echo "  checks are green for $head_sha; enabling auto-merge"
                if ! gh pr merge --auto --squash "$number"; then
                  echo "::error title=Auto-merge request failed::Could not enable auto-merge for #$number"
                  fail=1
                  continue
                fi
              else
                echo "  auto-merge already enabled."
              fi

              deadline=$(( $(date -u +%s) + MERGE_TIMEOUT_SECONDS ))
              while [ "$(date -u +%s)" -lt "$deadline" ] \
                && [ "$(gh pr view "$number" --json state --jq .state)" = "OPEN" ]; do
                sleep "$MERGE_POLL_SECONDS"
              done

              if [ "$(gh pr view "$number" --json state --jq .state)" = "MERGED" ]; then
                echo "  release PR #$number merged"
                landed=1
                merged=$((merged + 1))
              else
                echo "::warning title=Release PR merge did not land::PR #$number is still open ${MERGE_TIMEOUT_SECONDS}s after auto-merge was armed; the next pass will retry."
              fi
            fi

            if [ "$landed" -eq 0 ]; then
              created_at=$(gh pr view "$number" --json createdAt --jq .createdAt)
              age_hours=$(( ($(date -u +%s) - $(date -u -d "$created_at" +%s)) / 3600 ))
              if [ "$age_hours" -ge "$STALL_HOURS" ]; then
                echo "::error title=Release PR is stalled::PR #$number has been open ${age_hours}h; it should have merged once its checks were green."
                fail=1
              fi
            fi
          done

          if [ "$merged" -eq 0 ]; then
            exit "$fail"
          fi

          # The merge commit was pushed by GITHUB_TOKEN, which raises no `push`
          # event, so ask for the pass that cuts the tag and publishes it.
          echo "Release PR merged; re-dispatching this workflow to cut the release."
          if ! gh workflow run release-please.yml --ref main; then
            echo "::error title=Release dispatch failed::Could not start release-please.yml on main"
            fail=1
          fi

          exit "$fail"

  python-package:
    name: Build Python package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_native_abi3_config.py
      - run: python scripts/check_wheel_compat.py dist
      - run: python scripts/smoke_wheel_install.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-python-dist
          path: dist/*

  pypi:
    name: Publish to PyPI
    needs:
      - release-please
      - python-package
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Publishing stays fully automated only while this environment has no
    # required reviewers and no wait timer. Adding either one re-introduces a
    # manual approval step before every PyPI upload.
    environment:
      name: pypi
      url: https://pypi.org/project/adobepy/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adobepy-python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  windows-package:
    name: Build Windows package and upload to release
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install --upgrade "coverage[toml]" setuptools wheel
      - name: Package
        shell: pwsh
        run: ./scripts/package-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Upload to GitHub Release
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem "dist/*" -Include "*.zip","*.zip.sha256" | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No release assets found in dist/" }
          $tag = "${{ needs.release-please.outputs.tag_name }}"
          gh release upload $tag $assets --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
