# TEMPORARY. Dispatched once to settle whether the release gate's check-run
# query needs `checks: read`, then deleted. Trigger is workflow_dispatch only,
# so it never runs on its own.
name: zz-perm-probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  without-checks-read:
    name: "check-runs query without checks: read"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Probe
        run: |
          set -uo pipefail
          sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          echo "permissions: contents: read only"
          # Control: this one must succeed, or the job itself is misconfigured.
          if gh api "repos/$GH_REPO/commits/$sha" --jq .sha > /dev/null 2>&1; then
            echo "CONTROL commit read: OK"
          else
            echo "CONTROL commit read: FAILED"
          fi
          if out=$(gh api "repos/$GH_REPO/commits/$sha/check-runs?per_page=100&filter=latest" \
            --jq '.check_runs[] | "\(.name)|\(.status)|\(.conclusion)"' 2>&1); then
            echo "CHECK-RUNS: SUCCEEDED"
            printf '%s\n' "$out" | head -20
          else
            echo "CHECK-RUNS: FAILED"
            printf '%s\n' "$out"
          fi

  with-checks-read:
    name: "release gate against a real PR with checks: read"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      STALL_HOURS: "6"
      MERGE_TIMEOUT_SECONDS: "8"
      MERGE_POLL_SECONDS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Run the real gate script with the write calls shimmed out
        run: |
          set -euo pipefail

          # Lift the gate script verbatim out of the workflow. The block ends at
          # the first line that is non-blank and indented less than the script
          # body, which is what makes the trailing `exit "$fail"` -- not the one
          # inside the loop -- close it.
          awk '
            /^      - name: Gate and merge/ { instep = 1; next }
            instep && !collect && /^        run: \|$/ { collect = 1; next }
            collect {
              # Hold blank lines so a trailing one is not emitted.
              if ($0 ~ /^[ \t]*$/) { blanks = blanks "\n"; next }
              if ($0 !~ /^          /) exit
              printf "%s%s\n", blanks, substr($0, 11)
              blanks = ""
            }
          ' .github/workflows/release-please.yml > gate.sh

          echo "--- extracted gate script: $(wc -l < gate.sh) lines"
          head -3 gate.sh

          # Point the release-PR filter at this branch so the gate has
          # something to evaluate. Nothing else in the script is touched.
          sed "s#release-please--branches--main#${GITHUB_REF_NAME}#" gate.sh > gate-probe.sh
          grep -n "startswith(" gate-probe.sh

          # Suppress the two calls with side effects. Everything else -- the
          # check-runs query, the workflow-run query, the classification -- hits
          # the real API with this job's real token.
          mkdir -p "$RUNNER_TEMP/shim"
          cp "$(command -v gh)" "$RUNNER_TEMP/shim/gh.real"
          cat > "$RUNNER_TEMP/shim/gh" <<'SH'
          #!/usr/bin/env bash
          if [ "$1" = "pr" ] && [ "$2" = "merge" ]; then
            echo "[shim] suppressed: gh pr merge $*"
            exit 0
          fi
          if [ "$1" = "workflow" ] && [ "$2" = "run" ]; then
            echo "[shim] suppressed: gh workflow run $*"
            exit 0
          fi
          exec "$RUNNER_TEMP/shim/gh.real" "$@"
          SH
          chmod +x "$RUNNER_TEMP/shim/gh"
          export PATH="$RUNNER_TEMP/shim:$PATH"

          echo "--- running gate"
          bash gate-probe.sh
