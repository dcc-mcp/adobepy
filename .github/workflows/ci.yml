name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quick:
    name: Quick contracts (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.8"
          - "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install --upgrade "coverage[toml]"
      - run: npm run test:quick

  bridges:
    name: Bridge protocol mocks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:bridges

  # `scripts/package-release.ps1` gates the published Windows artifact behind
  # `npm run test:all`, but the packaging job below only exercises it with
  # `-SkipTests`. That left the release-time verification command unrun until
  # after the tag was published. Running the same command here keeps the PR gate
  # and the release pipeline on one definition of "verified".
  release-parity:
    name: Release command parity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install --upgrade "coverage[toml]" setuptools wheel
      - run: npm run test:all

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm ci
      - run: npm run security:check
      - run: npm run lint

  # TEMPORARY. Added to prove, against the real API, that the release gate's
  # check-runs query needs `checks: read` and that the extracted gate script
  # reaches a verdict. Removed again once it has served that purpose.
  perm-probe-a:
    name: "Probe A - check-runs without checks: read"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PROBE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Query check runs
        run: |
          set -uo pipefail
          echo "job permissions: contents: read only"
          # Control: must succeed, or this job is misconfigured rather than denied.
          if gh api "repos/$GH_REPO/commits/$PROBE_SHA" --jq .sha > /dev/null 2>&1; then
            echo "CONTROL commit read: OK"
          else
            echo "CONTROL commit read: FAILED"
          fi
          if out=$(gh api "repos/$GH_REPO/commits/$PROBE_SHA/check-runs?per_page=100&filter=latest" \
            --jq '.check_runs[] | "\(.name)|\(.status)|\(.conclusion)"' 2>&1); then
            echo "CHECK-RUNS: SUCCEEDED"
            printf '%s\n' "$out" | head -12
          else
            echo "CHECK-RUNS: FAILED"
            printf '%s\n' "$out"
          fi

  perm-probe-b:
    name: "Probe B - gate script with checks: read"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      STALL_HOURS: "6"
      MERGE_TIMEOUT_SECONDS: "8"
      MERGE_POLL_SECONDS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Run the real gate script with the write calls shimmed out
        run: |
          set -euo pipefail

          awk '
            /^      - name: Gate and merge/ { instep = 1; next }
            instep && !collect && /^        run: \|$/ { collect = 1; next }
            collect {
              if ($0 ~ /^[ \t]*$/) { blanks = blanks "\n"; next }
              if ($0 !~ /^          /) exit
              printf "%s%s\n", blanks, substr($0, 11)
              blanks = ""
            }
          ' .github/workflows/release-please.yml > gate.sh

          echo "--- extracted gate script: $(wc -l < gate.sh) lines"
          head -3 gate.sh

          # Point the release-PR filter at this branch so the gate has
          # something to evaluate. Nothing else in the script is touched.
          sed "s#release-please--branches--main#${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}#" gate.sh > gate-probe.sh
          grep -n "startswith(" gate-probe.sh

          mkdir -p "$RUNNER_TEMP/shim"
          cp "$(command -v gh)" "$RUNNER_TEMP/shim/gh.real"
          cat > "$RUNNER_TEMP/shim/gh" <<'SH'
          #!/usr/bin/env bash
          if [ "$1" = "pr" ] && [ "$2" = "merge" ]; then
            echo "[shim] suppressed: gh $*"
            exit 0
          fi
          if [ "$1" = "workflow" ] && [ "$2" = "run" ]; then
            echo "[shim] suppressed: gh $*"
            exit 0
          fi
          exec "$RUNNER_TEMP/shim/gh.real" "$@"
          SH
          chmod +x "$RUNNER_TEMP/shim/gh"
          export PATH="$RUNNER_TEMP/shim:$PATH"

          echo "--- running gate"
          bash gate-probe.sh

  package:
    name: Windows package smoke
    runs-on: windows-latest
    needs:
      - quick
      - bridges
      - quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: python -m pip install --upgrade "coverage[toml]" setuptools wheel build twine
      - name: Check Python distribution
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/check_native_abi3_config.py
          python scripts/check_wheel_compat.py dist
          python scripts/smoke_wheel_install.py dist
      - name: Build package
        shell: pwsh
        run: ./scripts/package-release.ps1 -SkipTests
      - name: Check package outputs
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "adobepy-*-windows-x64.zip" | Select-Object -First 1
          if (-not $zip) { throw "package zip was not created" }
          if (-not (Test-Path "$($zip.FullName).sha256")) { throw "package checksum was not created" }
          $expanded = Join-Path $env:RUNNER_TEMP "adobepy-package-version-check"
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $expanded
          $packageRoot = Get-ChildItem -LiteralPath $expanded -Directory | Select-Object -First 1
          if (-not $packageRoot) { throw "package zip has no root directory" }
          node scripts/check-release-versions.js --root $packageRoot.FullName
      - name: Install smoke test
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "adobepy-*-windows-x64.zip" | Select-Object -First 1
          ./scripts/smoke_install.ps1 -ZipPath $zip.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: adobepy-windows-x64
          path: |
            dist/*.zip
            dist/*.zip.sha256
